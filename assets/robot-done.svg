<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" width="320" height="196"><style>.hop{animation:hop 1.1s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}.armUpL{transform-origin:122px 112px;animation:upL 1.1s ease-in-out infinite}@keyframes upL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(165deg)}}.armUpR{transform-origin:198px 112px;animation:upR 1.1s ease-in-out infinite}@keyframes upR{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-165deg)}}.conf{animation:fall 2.6s linear infinite}@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(215px) rotate(320deg)}}.badge{transform-box:fill-box;transform-origin:center;animation:badge .6s ease-out 1, pulse 2s 0.6s ease-in-out infinite}@keyframes badge{from{transform:scale(0)}to{transform:scale(1)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}.rocket{animation:rk 1.4s ease-in-out infinite}@keyframes rk{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.flame{transform-box:fill-box;transform-origin:top;animation:fl2 .2s infinite alternate}@keyframes fl2{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}.b2{animation:pop 1.8s .3s infinite}.eye{transform-box:fill-box;transform-origin:center;animation:bl 2.4s infinite}@keyframes bl{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}.ant{animation:an .6s infinite alternate}@keyframes an{from{opacity:.3}to{opacity:1}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.look{animation:look 2.2s ease-in-out infinite}@keyframes look{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}.tilt{transform-origin:160px 100px;animation:tilt 2.4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}.gear{transform-box:fill-box;transform-origin:center;animation:spin 2.5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.b1{animation:pop 1.8s infinite}.b2{animation:pop 1.8s .3s infinite}.b3{animation:pop 1.8s .6s infinite}@keyframes pop{0%,100%{opacity:.25}50%{opacity:1}}.scan{animation:scan 1.8s ease-in-out infinite}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(62px)}100%{transform:translateY(0)}}.mag{animation:mag 2.6s ease-in-out infinite}@keyframes mag{0%,100%{transform:translate(0,0)}25%{transform:translate(30px,14px)}50%{transform:translate(10px,40px)}75%{transform:translate(-10px,20px)}}.pin{animation:pin .9s ease-in-out infinite}@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s ease-in-out infinite}@keyframes grow{0%{transform:scaleY(.2)}50%{transform:scaleY(1)}100%{transform:scaleY(.2)}}.coin{animation:coin 1.8s ease-in infinite;opacity:0}@keyframes coin{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}.flash{animation:flash 1.5s infinite}@keyframes flash{0%,80%,100%{opacity:0}85%{opacity:.95}}.draw{stroke-dasharray:160;animation:draw 2.2s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:160}60%,100%{stroke-dashoffset:0}}.shake{animation:sh .09s infinite alternate}@keyframes sh{from{transform:translate(-1px,0)}to{transform:translate(1px,1px)}}.key{animation:kf .3s infinite}@keyframes kf{0%,65%{fill:#94A3B8}80%{fill:#FBBF24}100%{fill:#94A3B8}}.armL{transform-origin:125px 112px;animation:al .17s infinite alternate}.armR{transform-origin:195px 112px;animation:ar .21s infinite alternate}@keyframes al{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}@keyframes ar{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}.wave{transform-origin:198px 112px;animation:wave 1.2s ease-in-out infinite}@keyfram